<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseline Kit browser regressions</title>
    <link rel="stylesheet" href="/__baseline.css" />
    <style>
      html {
        font-size: 16px;
      }
    </style>
    <script>
      // ?root=N sets the root font size in px before hydration (rem base
      // checks); ?root=medium uses the browser's default font size.
      {
        const root = new URLSearchParams(location.search).get('root')
        if (root) {
          document.documentElement.style.fontSize = /^[\d.]+$/.test(root)
            ? root + 'px'
            : root
        }
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
