name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  react-core:
    name: React/Core Node 22 release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.12'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run React/Core Tests
        run: bun run test:react-core

  release:
    name: Release
    needs: react-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Setup npm for trusted publishing
        run: |
          npm install --global npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.12'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify before release
        run: |
          bunx playwright install --with-deps chromium firefox webkit
          bun run verify:integration

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ github.token }}
          publish-script: bun run release
          version-script: bun run version
          commit-message: 'chore: update version and changelog'
          pr-title: 'chore: update version and changelog'
          create-github-releases: true
          push-with-git-cli: true
        env:
          NPM_CONFIG_PROVENANCE: 'true'
